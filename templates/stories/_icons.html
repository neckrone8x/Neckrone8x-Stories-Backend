{#- Small inline SVG icons (24x24 grid, stroke = currentColor).
    They are always aria-hidden: whatever they mean is said in text or in
    the aria-label of the button/link around them. -#}
{% macro icon(name, size=20, cls='') -%}
<svg class="icon{% if cls %} {{ cls }}{% endif %}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
{%- if name == 'search' -%}<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
{%- elif name == 'sun' -%}<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif name == 'moon' -%}<path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/>
{%- elif name == 'pen' -%}<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
{%- elif name == 'eye' -%}<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == 'clock' -%}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == 'calendar' -%}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>
{%- elif name == 'arrow-right' -%}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == 'arrow-left' -%}<path d="M19 12H5M11 18l-6-6 6-6"/>
{%- elif name == 'link' -%}<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>
{%- elif name == 'share' -%}<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>
{%- elif name == 'chat' -%}<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/>
{%- elif name == 'check' -%}<path d="M20 6L9 17l-5-5"/>
{%- elif name == 'lock' -%}<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
{%- elif name == 'alert' -%}<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.5"/>
{%- elif name == 'book' -%}<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20v3H6.5"/>
{%- elif name == 'whatsapp' -%}<path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.3z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.6-2-1-1 .8a5 5 0 0 1-2.7-2.7l.8-1-1-2z"/>
{%- elif name == 'facebook' -%}<path d="M15 3h-2.5A3.5 3.5 0 0 0 9 6.5V9H6.5v3.5H9V21h3.5v-8.5H15l.5-3.5h-3V7a1 1 0 0 1 1-1H15z"/>

{%- elif name == 'external' -%}<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
{%- elif name == 'love' -%}<path d="M12 20s-7.2-4.3-9.3-8.7A5.1 5.1 0 0 1 12 6.1a5.1 5.1 0 0 1 9.3 5.2C19.2 15.7 12 20 12 20z"/>
{%- elif name == 'like' -%}<path d="M7 10.5V21H3.5V10.5z"/><path d="M7 10.5l4.2-7.3a2 2 0 0 1 3.6 1.4L14 9.5h5.6a2 2 0 0 1 2 2.4l-1.5 7.4a2 2 0 0 1-2 1.7H7"/>
{%- elif name == 'laugh' -%}<circle cx="12" cy="12" r="9"/><path d="M8 9.8c.6-.8 1.6-.8 2.2 0M13.8 9.8c.6-.8 1.6-.8 2.2 0"/><path d="M7.5 13.5h9a4.5 4.5 0 0 1-9 0z"/>

{%- elif name == 'sad' -%}<circle cx="12" cy="12" r="9"/><path d="M9 9.5h.01M15 9.5h.01"/><path d="M8.5 16.5a4.5 4.5 0 0 1 7 0"/>
{%- elif name == 'trend' -%}<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>
{%- elif name == 'bookmark' -%}<path class="icon-fill" d="M6 3.5h12v17l-6-4.2-6 4.2z"/>
{%- elif name == 'close' -%}<path d="M6 6l12 12M18 6L6 18"/>
{%- elif name == 'adult' -%}<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>
{%- endif -%}
</svg>
{%- endmacro %}
