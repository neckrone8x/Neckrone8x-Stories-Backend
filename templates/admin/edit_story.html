<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Edit Story | Neckrone8x</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/admin.css') }}"
    >
</head>
<body>
    <div class="admin-shell">
        <aside class="sidebar">
            <div class="sidebar-logo">
                NECKRONE8X
                <span>STORIES</span>
            </div>
            <div class="sidebar-title">Administration</div>
            <nav class="sidebar-menu">
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('stories') }}">Stories</a>
                <a href="{{ url_for('manage_stories') }}" class="active">Manage Stories</a>
                <a href="{{ url_for('create_story') }}">Create Story</a>
                <a href="{{ url_for('manage_submissions') }}">Submissions</a>
                <a href="{{ url_for('manage_comments') }}">Comments</a>
                <a href="{{ url_for('admin_analytics') }}">Analytics</a>
            </nav>
            <a href="{{ url_for('logout') }}" class="sidebar-logout">Logout</a>
        </aside>
        <main class="main">
            <div class="topbar">
                <div>
                    <h1>Edit Story</h1>
                    <p>{{ story.title }}</p>
                </div>
                <a href="{{ url_for('manage_stories') }}" class="create-button">
                    ← Back to Stories
                </a>
            </div>
            {% if error %}
                <div class="login-error">{{ error }}</div>
            {% endif %}
            <section class="section">
                <form method="POST" action="{{ url_for('edit_story', story_id=story.id) }}">
    {{ csrf_field() }}
                    <div class="form-group">
                        <label for="title">Story Title</label>
                        <input
                            type="text"
                            id="title"
                            name="title"
                            maxlength="200"
                            required
                            value="{{ story.title }}"
                        >
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category" required>
                            {% if story.category not in categories %}
                                {#- an old category that is no longer on the list stays until changed -#}
                                <option value="{{ story.category }}" selected>{{ story.category }} (old, not on the list)</option>
                            {% endif %}
                            {% for item in categories %}
                                <option value="{{ item }}"{% if story.category == item %} selected{% endif %}>{{ item }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="author">Author</label>
                        <input
                            type="text"
                            id="author"
                            name="author"
                            maxlength="100"
                            value="{{ story.author }}"
                        >
                    </div>
                    <div class="form-group">
                        <label for="cover_image">Cover Image Link (optional)</label>
                        <input
                            type="url"
                            id="cover_image"
                            name="cover_image"
                            placeholder="https://..."
                            maxlength="500"
                            value="{{ story.cover_image or '' }}"
                        >
                    </div>
                    <div class="form-group">
                        <label for="content">Story Content</label>
                        <textarea
                            id="content"
                            name="content"
                            required
                        >{{ story.content }}</textarea>
                    </div>
                    <button type="submit" class="create-button">
                        Save Changes
                    </button>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
