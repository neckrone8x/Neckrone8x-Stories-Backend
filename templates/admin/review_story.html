<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Review Story &#8212; Neckrone8x
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #080c14;

            color: #ffffff;

            font-family: Arial, sans-serif;

        }


        .container {

            max-width: 900px;

            margin: auto;

            padding: 40px 20px;

        }


        h1 {

            margin-top: 35px;

            margin-bottom: 8px;

        }


        .subtitle {

            color: #667085;

            margin-bottom: 30px;

        }


        /* ==============================
           STORY NAVIGATION
        ============================== */

        .story-navigation {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 28px;

            padding: 14px 16px;

            background: #111827;

            border: 1px solid #273449;

            border-radius: 14px;

        }


        .nav-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 9px 14px;

            background: #1f2937;

            border: 1px solid #374151;

            border-radius: 9px;

            color: #d1d5db;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;

        }


        .nav-button:hover {

            background: #273449;

            color: #ffffff;

            transform: translateY(-1px);

        }


        /* ==============================
           STORY CARD
        ============================== */

        .card {

            background: #0d1320;

            border: 1px solid #202938;

            border-radius: 12px;

            padding: 30px;

        }


        .card h2 {

            margin-top: 0;

            margin-bottom: 15px;

            line-height: 1.3;

        }


        .meta {

            color: #667085;

            margin-bottom: 25px;

            font-size: 14px;

        }


        .content {

            white-space: pre-wrap;

            line-height: 1.8;

            font-size: 16px;

            overflow-wrap: anywhere;

        }


        /* ==============================
           ACTIONS
        ============================== */

        .actions {

            display: flex;

            gap: 12px;

            margin-top: 35px;

            padding-top: 25px;

            border-top: 1px solid #202938;

        }


        .actions form {

            margin: 0;

        }


        button {

            border: none;

            border-radius: 8px;

            padding: 13px 22px;

            font-weight: bold;

            cursor: pointer;

            font-size: 14px;

        }


        .approve {

            background: #00d9a5;

            color: #061018;

        }


        .delete {

            background: #d94b5b;

            color: #ffffff;

        }


        button:hover {

            opacity: 0.85;

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            .container {

                padding: 25px 15px;

            }


            .story-navigation {

                gap: 10px;

                padding: 10px;

            }


            .nav-button {

                padding: 8px 10px;

                font-size: 12px;

            }


            .card {

                padding: 20px;

            }


            .actions {

                flex-direction: column;

            }


            .actions form,

            .actions button {

                width: 100%;

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- ==============================
             NAVIGATION
        ============================== -->

        <div class="story-navigation">


            <a
                href="{{ url_for('dashboard') }}"
                class="nav-button"
            >

                &#8592; Dashboard

            </a>


            <a
                href="{{ url_for('manage_stories') }}"
                class="nav-button"
            >

                Manage Stories

            </a>


        </div>



        <!-- ==============================
             PAGE HEADER
        ============================== -->

        <h1>

            Review Story

        </h1>


        <p class="subtitle">

            Review this submission before publishing it.

        </p>



        <!-- ==============================
             STORY
        ============================== -->

        <div class="card">


            <h2>

                {{ story.title }}

            </h2>


            <div class="meta">

                {{ story.category }}

                &#183;

                {{ story.author }}

                &#183;

                {{ story.created_at.strftime("%B %d, %Y") }}

            </div>


            <div class="content">

                {{ story.content }}

            </div>



            <!-- ==============================
                 ACTIONS
            ============================== -->

            <div class="actions">


                <!-- APPROVE -->

                <form
                    method="POST"
                    action="{{ url_for(
                        'approve_story',
                        story_id=story.id
                    ) }}"
                >

                    <button
                        type="submit"
                        class="approve"
                    >

                        &#10003; Approve &amp; Publish

                    </button>

                </form>



                <!-- DELETE -->

                <form
                    method="POST"
                    action="{{ url_for(
                        'delete_story',
                        story_id=story.id
                    ) }}"
                    onsubmit="return confirm(
                        'Delete this story permanently?'
                    );"
                >

                    <button
                        type="submit"
                        class="delete"
                    >

                        Delete

                    </button>

                </form>


            </div>


        </div>


    </div>


</body>

</html>
